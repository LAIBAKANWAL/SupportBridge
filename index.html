<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SupportBridge - Live Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .phone {
            width: 375px;
            height: 667px;
            background: #000;
            border-radius: 30px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .screen {
            width: 100%;
            height: 100%;
            background: #fff;
            border-radius: 20px;
            padding: 20px;
            overflow-y: auto;
            position: relative;
        }
        .header {
            text-align: center;
            color: #4a5568;
            margin-bottom: 30px;
        }
        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }
        .screen-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding: 10px 0;
        }
        .nav-btn {
            padding: 8px 16px;
            background: #e2e8f0;
            border: none;
            border-radius: 20px;
            font-size: 12px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.3s;
        }
        .nav-btn:hover {
            background: #667eea;
            color: white;
        }
        .nav-btn.active {
            background: #667eea;
            color: white;
        }
        .screen-content {
            padding: 20px 0;
        }
        .feature-list {
            list-style: none;
            padding: 0;
        }
        .feature-list li {
            padding: 15px;
            margin: 10px 0;
            background: #f7fafc;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        .demo-form {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin: 15px 0;
        }
        .demo-input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
        }
        .demo-btn {
            width: 100%;
            padding: 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px 0;
        }
        .status {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #48bb78;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="status">🟢 LIVE DEMO</div>
    
    <div class="phone">
        <div class="screen">
            <div class="header">
                <div class="logo">🤝 SupportBridge</div>
                <div>Donation & Fundraising Platform</div>
            </div>
            
            <div class="screen-nav">
                <button class="nav-btn active" onclick="showScreen('login')">Login</button>
                <button class="nav-btn" onclick="showScreen('home')">Home</button>
                <button class="nav-btn" onclick="showScreen('donate')">Donate</button>
                <button class="nav-btn" onclick="showScreen('profile')">Profile</button>
                <button class="nav-btn" onclick="showScreen('fundraise')">Fundraise</button>
            </div>
            
            <div id="screen-content" class="screen-content">
                <!-- Content will be loaded here -->
            </div>
        </div>
    </div>

    <script>
        const screens = {
            login: `
                <div class="demo-form">
                    <h3>🔐 Login Screen</h3>
                    <input type="email" class="demo-input" placeholder="Email Address" value="demo@supportbridge.com">
                    <input type="password" class="demo-input" placeholder="Password" value="••••••••">
                    <button class="demo-btn">Sign In</button>
                    <p style="text-align: center; margin: 15px 0;">
                        <a href="#" onclick="showScreen('signup')">Don't have an account? Sign Up</a>
                    </p>
                </div>
                <div style="margin-top: 20px; font-size: 14px; color: #666;">
                    <p>✅ Secure authentication</p>
                    <p>✅ Social login options</p>
                    <p>✅ Password recovery</p>
                </div>
            `,
            home: `
                <h3>🏠 Home Dashboard</h3>
                <ul class="feature-list">
                    <li>💰 <strong>Total Donations:</strong> $125,450</li>
                    <li>🎯 <strong>Active Campaigns:</strong> 23</li>
                    <li>👥 <strong>Donors:</strong> 1,247</li>
                    <li>🏆 <strong>Success Rate:</strong> 89%</li>
                </ul>
                <div style="margin-top: 20px;">
                    <h4>📊 Recent Activity</h4>
                    <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin: 10px 0;">
                        <p>🎉 <strong>John D.</strong> donated $500 to "Help Build School"</p>
                        <small style="color: #666;">2 minutes ago</small>
                    </div>
                    <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin: 10px 0;">
                        <p>📝 <strong>Sarah M.</strong> created new campaign "Medical Fund"</p>
                        <small style="color: #666;">1 hour ago</small>
                    </div>
                </div>
            `,
            donate: `
                <h3>💰 Make a Donation</h3>
                <div class="demo-form">
                    <label>Select Campaign:</label>
                    <select class="demo-input">
                        <option>🏥 Emergency Medical Fund - $2,340 raised</option>
                        <option>🏫 Build Community School - $15,670 raised</option>
                        <option>🌍 Clean Water Project - $8,920 raised</option>
                    </select>
                    
                    <label>Donation Amount:</label>
                    <div style="display: flex; gap: 10px; margin: 10px 0;">
                        <button class="nav-btn">$25</button>
                        <button class="nav-btn">$50</button>
                        <button class="nav-btn active">$100</button>
                        <button class="nav-btn">$250</button>
                    </div>
                    <input type="number" class="demo-input" placeholder="Custom amount" value="100">
                    
                    <button class="demo-btn">💳 Donate Now</button>
                </div>
                <p style="font-size: 14px; color: #666; margin-top: 15px;">
                    ✅ Secure payment processing<br>
                    ✅ Tax-deductible receipts<br>
                    ✅ 100% goes to the cause
                </p>
            `,
            profile: `
                <h3>👤 User Profile</h3>
                <div style="text-align: center; margin: 20px 0;">
                    <div style="width: 80px; height: 80px; background: #667eea; border-radius: 50%; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; color: white; font-size: 24px;">👤</div>
                    <h4>Demo User</h4>
                    <p style="color: #666;">demo@supportbridge.com</p>
                </div>
                
                <ul class="feature-list">
                    <li>💝 <strong>Total Donated:</strong> $2,450</li>
                    <li>🎯 <strong>Campaigns Supported:</strong> 12</li>
                    <li>🏆 <strong>Member Since:</strong> January 2024</li>
                    <li>⭐ <strong>Impact Score:</strong> 95/100</li>
                </ul>
                
                <div style="margin-top: 20px;">
                    <button class="demo-btn">✏️ Edit Profile</button>
                    <button class="demo-btn" style="background: #e53e3e;">🔒 Account Settings</button>
                </div>
            `,
            fundraise: `
                <h3>🎯 Create Fundraiser</h3>
                <div class="demo-form">
                    <input type="text" class="demo-input" placeholder="Campaign Title" value="Help Build Community Garden">
                    <textarea class="demo-input" rows="3" placeholder="Tell your story...">We need your help to build a community garden that will provide fresh vegetables for families in need...</textarea>
                    <input type="number" class="demo-input" placeholder="Goal Amount ($)" value="5000">
                    
                    <label>Category:</label>
                    <select class="demo-input">
                        <option>🌱 Environment</option>
                        <option>🏥 Medical</option>
                        <option>🎓 Education</option>
                        <option>🏠 Community</option>
                    </select>
                    
                    <button class="demo-btn">📸 Add Photos</button>
                    <button class="demo-btn">🚀 Launch Campaign</button>
                </div>
                
                <p style="font-size: 14px; color: #666; margin-top: 15px;">
                    ✅ Easy campaign creation<br>
                    ✅ Social media integration<br>
                    ✅ Real-time progress tracking
                </p>
            `
        };

        function showScreen(screenName) {
            // Update active button
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // Update content
            document.getElementById('screen-content').innerHTML = screens[screenName];
        }

        // Initialize with login screen
        document.getElementById('screen-content').innerHTML = screens.login;
    </script>
</body>
</html>
